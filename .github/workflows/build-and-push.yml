name: Build & Publish
on:
  push:
    tags:
      - "*"
    branches:
      - feature/cicd # Run on this branch for testing only

  workflow_dispatch: # Can be manually ran still
    inputs:
      tag:
        description: 'Image test tag'
        required: true
        default: 'test'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/recipe-book:${{ github.ref_name }}
            ${{ vars.DOCKERHUB_USERNAME }}/recipe-book:latest
  deploy:
    name: Build
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Execute remote SSH commands using password
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.SSH_PORT }}
          script: |
            docker pull ${{ vars.DOCKERHUB_USERNAME }}/recipe-book:latest
            docker stop recipe-book || true
            docker rm recipe-book || true
            docker run -d \
              -v /var/www/recipe_book/laravel.conf:/etc/apache2/sites-enabled/laravel.conf \
              -v /var/www/recipe_book/public:/var/www/html/public \
              -v /var/www/recipe_book/.env:/var/www/html/.env \
              -v /var/www/recipe_book/AppserviceProvider.php:/var/www/html/app/Providers/AppServiceProvider.php 
              -p 8080:80 \
              --restart unless-stopped \
              --name recipe-cookbook \
              ${{ vars.DOCKERHUB_USERNAME }}/recipe-book:${{ github.ref_name }}
              