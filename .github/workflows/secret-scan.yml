name: Secret Scan
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  gitleaks:
    name: Detect Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Step One
        run: echo "Step one successful"
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  bearer:
    name: SAST Scan
    runs-on: ubuntu-latest
    needs: gitleaks
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Bearer
        uses: bearer/bearer-action@v2
        with:
          format: sarif
          output: bearer-report.sarif
          scanner: sast

      - name: Upload findings
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bearer-report
          path: bearer-report.sa
